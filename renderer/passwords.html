<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self';" />
  <title>Менеджер паролей</title>
  <link rel="stylesheet" href="passwords.css" />
</head>
<body>
  <main id="wrap">
    <nav class="page-nav">
      <a href="settings.html">Настройки</a>
      <a href="history.html">История</a>
      <a href="downloads.html">Загрузки</a>
    </nav>
    <h1>Менеджер паролей</h1>

    <!-- создание мастер-пароля -->
    <section id="setup" class="hidden">
      <h2>Включите менеджер паролей</h2>
      <p class="hint">Пароли хранятся только на этом компьютере и шифруются. Мастер-пароль нужен, чтобы их видеть.</p>
      <form id="setup-form">
        <input type="password" id="mp1" placeholder="Новый мастер-пароль (мин. 4 символа)" autocomplete="new-password" />
        <input type="password" id="mp2" placeholder="Повторите мастер-пароль" autocomplete="new-password" />
        <button class="btn primary" type="submit">Создать</button>
      </form>
    </section>

    <!-- разблокировка -->
    <section id="unlock" class="hidden">
      <h2>Введите мастер-пароль</h2>
      <form id="unlock-form">
        <input type="password" id="up" placeholder="Мастер-пароль" autocomplete="current-password" />
        <button class="btn primary" type="submit">Разблокировать</button>
      </form>
    </section>

    <!-- список -->
    <section id="main" class="hidden">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Поиск по сайту, логину…" spellcheck="false" />
        <button class="btn" id="btn-add">+ Добавить</button>
        <button class="btn" id="btn-lock">Заблокировать</button>
        <button class="btn" id="btn-change">Сменить мастер-пароль</button>
      </div>

      <form id="add-form" class="hidden">
        <input type="text" id="add-url" placeholder="Адрес сайта, напр. https://mail.google.com/" spellcheck="false" />
        <input type="text" id="add-user" placeholder="Логин / email" spellcheck="false" autocomplete="off" />
        <input type="password" id="add-pass" placeholder="Пароль" autocomplete="new-password" />
        <button class="btn primary" type="submit">Сохранить</button>
        <button class="btn" type="button" id="add-cancel">Отмена</button>
      </form>

      <form id="change-form" class="hidden">
        <input type="password" id="ch-old" placeholder="Текущий мастер-пароль" autocomplete="current-password" />
        <input type="password" id="ch-new1" placeholder="Новый мастер-пароль" autocomplete="new-password" />
        <input type="password" id="ch-new2" placeholder="Повторите новый" autocomplete="new-password" />
        <button class="btn primary" type="submit">Сменить</button>
        <button class="btn" type="button" id="ch-cancel">Отмена</button>
      </form>

      <div id="list"></div>
    </section>

    <div id="about">Пароли шифруются AES-256-GCM и хранятся только на этом компьютере.</div>
  </main>

  <div id="flash" class="hidden"></div>
  <script src="passwords.js"></script>
</body>
</html>
